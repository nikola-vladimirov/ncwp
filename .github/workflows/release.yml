# A push to main whose plugin Version has no release yet publishes release vX.Y.Z with the plugin zip.
# Sites with Nashenski Commerce then see the update in Dashboard > Updates.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^Version:[[:space:]]*//p' nashenski-commerce.php | tr -d '\r')
          if gh release view "v$v" > /dev/null 2>&1; then echo "v$v is already released"; exit 0; fi
          git archive --format=zip --prefix=nashenski-commerce/ -o "nashenski-commerce-$v.zip" HEAD
          awk -v h="## $v " 'index($0, h) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          gh release create "v$v" "nashenski-commerce-$v.zip" --title "Nashenski Commerce $v" --notes-file notes.md --target "$GITHUB_SHA"
