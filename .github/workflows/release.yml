# A push to main whose plugin Version has no release yet publishes release vX.Y.Z with two zips:
# nashenski-commerce-X.Y.Z.zip (the plugin) and nashenski-commerce-wporg-X.Y.Z.zip (the same without the bundled
# Bulgarian .po/.mo/.l10n.php and the .pot, for WordPress.org, which serves translations as language packs).
# A version with a dash (0.16.0-beta1) is published as a pre-release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^Version:[[:space:]]*//p' nashenski-commerce.php | tr -d '\r')
          if gh release view "v$v" > /dev/null 2>&1; then echo "v$v is already released"; exit 0; fi
          git archive --format=zip --prefix=nashenski-commerce/ -o "nashenski-commerce-$v.zip" HEAD
          cp "nashenski-commerce-$v.zip" "nashenski-commerce-wporg-$v.zip"
          zip -dq "nashenski-commerce-wporg-$v.zip" 'nashenski-commerce/languages/*.po' 'nashenski-commerce/languages/*.mo' 'nashenski-commerce/languages/*.l10n.php' 'nashenski-commerce/languages/*.pot'
          awk -v h="## $v " 'index($0, h) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          pre=""; case "$v" in *-*) pre="--prerelease";; esac
          gh release create "v$v" "nashenski-commerce-$v.zip" "nashenski-commerce-wporg-$v.zip" $pre --title "Nashenski Commerce $v" --notes-file notes.md --target "$GITHUB_SHA"
